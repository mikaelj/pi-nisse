# Continuous integration for Nisse.
#
# The Rust quality gates (plan section 0.4) run on every platform,
# including Windows x86_64 (plan milestone 27). The Windows job is the
# Windows CI: the full test suite there covers paths with spaces,
# non-ASCII path segments and file names, CRLF source content, linked
# worktrees, the Pi-host child process, and the MCP stdio subprocess
# (see tests/integration/windows_compat.rs).
#
# The default test suite requires no Internet access and no real LLM
# provider: reviewer-dependent tests use the deterministic fake runtime
# of the Pi host. Node.js is only needed because the host itself is a
# TypeScript child process (Node >= 23.6 for type stripping).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is Windows x86_64 Server.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml. Keep the
      # value in sync with channel = "1.93.0" there; installing it directly
      # avoids downloading an unused second toolchain on every run.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Git is preinstalled on all runners; Node is required by the
      # Pi-host child process spawned by reviewer tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features
        env:
          # Windows runners are materially slower than the frozen perf
          # bounds' reference machine; the perf suite exists to catch
          # regressions, not machine-speed differences.
          NISSE_PERF_SCALE: ${{ matrix.os == 'windows-latest' && '4' || '1' }}

  # TypeScript gates (plan section 0.4): the Pi review host and the
  # Pi integration package are shipped product surfaces, so their
  # typecheck and test suites run on every push alongside the Rust
  # gates. Node 24 satisfies both packages' engines >= 23.6.
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            runtime/pi-host/package-lock.json
            integrations/pi/package-lock.json

      - name: Typecheck and test (pi-host)
        working-directory: runtime/pi-host
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Typecheck and test (pi integration)
        working-directory: integrations/pi
        run: |
          npm ci
          npm run typecheck
          npm run test
