[package]
name = "nisse"
version = "0.1.0"
edition = "2024"
description = "Nisse local software-review engine"
license = "MIT OR Apache-2.0"

[lib]
name = "nisse"
path = "src/lib.rs"

[[bin]]
name = "nisse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
